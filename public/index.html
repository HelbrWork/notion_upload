<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Notion ticket uploader</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, Arial, sans-serif;
      background: #f5f7fb;
      color: #111827;
    }
    .page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
    }
    .card {
      width: 100%;
      max-width: 920px;
      background: #ffffff;
      border-radius: 24px;
      padding: 28px;
      box-shadow: 0 16px 50px rgba(17, 24, 39, 0.08);
      border: 1px solid #e5e7eb;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 30px;
      line-height: 1.15;
    }
    .sub {
      margin: 0 0 22px;
      color: #6b7280;
      line-height: 1.45;
    }
    .dropzone {
      border: 2px dashed #cbd5e1;
      border-radius: 20px;
      background: #f8fbff;
      padding: 42px 24px;
      text-align: center;
      cursor: pointer;
      transition: 0.18s ease;
    }
    .dropzone.dragover {
      background: #eef5ff;
      border-color: #3b82f6;
      transform: translateY(-1px);
    }
    .dropzone strong {
      display: block;
      font-size: 20px;
      margin-bottom: 8px;
    }
    .hint {
      color: #6b7280;
      font-size: 14px;
    }
    .toolbar {
      display: grid;
      grid-template-columns: 1fr auto auto;
      gap: 12px;
      margin-top: 18px;
    }
    .toolbar input {
      width: 100%;
      padding: 13px 14px;
      border-radius: 14px;
      border: 1px solid #d1d5db;
      font-size: 14px;
      outline: none;
    }
    .toolbar input:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }
    button {
      border: 0;
      border-radius: 14px;
      padding: 13px 18px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    .primary {
      background: #111827;
      color: #fff;
    }
    .secondary {
      background: #eef2f7;
      color: #111827;
    }
    button:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }
    .files {
      margin: 18px 0 0;
      padding: 0;
      list-style: none;
      display: grid;
      gap: 10px;
    }
    .files li {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 14px;
      border: 1px solid #e5e7eb;
      border-radius: 14px;
      background: #fff;
      font-size: 14px;
    }
    .files small {
      color: #6b7280;
    }
    .status {
      margin-top: 18px;
      padding: 14px 16px;
      border-radius: 14px;
      background: #f8fafc;
      border: 1px solid #e5e7eb;
      white-space: pre-wrap;
      line-height: 1.45;
      min-height: 60px;
      font-size: 14px;
    }
    .meta {
      margin-top: 12px;
      color: #6b7280;
      font-size: 13px;
    }
    @media (max-width: 720px) {
      .toolbar {
        grid-template-columns: 1fr;
      }
      .files li {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="card">
      <h1>Upload tickets to Notion</h1>
      <p class="sub">
        Перетащи изображения сюда или выбери их вручную. На каждый файл создастся отдельная запись в Notion.
      </p>

      <div id="dropzone" class="dropzone">
        <strong>Drag & drop files here</strong>
        <div class="hint">или нажми, чтобы выбрать изображения</div>
        <input id="fileInput" type="file" accept="image/*" multiple hidden />
      </div>

      <div class="toolbar">
        <input id="titlePrefix" type="text" placeholder="Префикс названия, например Casino" />
        <button id="uploadBtn" class="primary" type="button">Upload</button>
        <button id="clearBtn" class="secondary" type="button">Clear</button>
      </div>

      <ul id="fileList" class="files"></ul>
      <div id="status" class="status">Пока ничего не выбрано.</div>
      <div class="meta">Лимит этого MVP: до 20 MB на файл.</div>
    </div>
  </div>

  <script>
    const dropzone = document.getElementById("dropzone");
    const fileInput = document.getElementById("fileInput");
    const uploadBtn = document.getElementById("uploadBtn");
    const clearBtn = document.getElementById("clearBtn");
    const fileList = document.getElementById("fileList");
    const statusBox = document.getElementById("status");
    const titlePrefix = document.getElementById("titlePrefix");

    let selectedFiles = [];

    function formatSize(bytes) {
      if (bytes < 1024) return `${bytes} B`;
      if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(1)} KB`;
      return `${(bytes / (1024 * 1024)).toFixed(2)} MB`;
    }

    function setStatus(text) {
      statusBox.textContent = text;
    }

    function renderFiles() {
      fileList.innerHTML = "";

      if (!selectedFiles.length) {
        setStatus("Пока ничего не выбрано.");
        return;
      }

      selectedFiles.forEach((file, index) => {
        const li = document.createElement("li");
        li.innerHTML = `
          <span>${index + 1}. ${file.name}</span>
          <small>${formatSize(file.size)}</small>
        `;
        fileList.appendChild(li);
      });

      setStatus(`Выбрано файлов: ${selectedFiles.length}`);
    }

    function addFiles(fileListLike) {
      const incoming = Array.from(fileListLike).filter((file) => file.type.startsWith("image/"));
      selectedFiles = [...selectedFiles, ...incoming];
      renderFiles();
    }

    dropzone.addEventListener("click", () => fileInput.click());

    dropzone.addEventListener("dragover", (e) => {
      e.preventDefault();
      dropzone.classList.add("dragover");
    });

    dropzone.addEventListener("dragleave", () => {
      dropzone.classList.remove("dragover");
    });

    dropzone.addEventListener("drop", (e) => {
      e.preventDefault();
      dropzone.classList.remove("dragover");
      addFiles(e.dataTransfer.files);
    });

    fileInput.addEventListener("change", (e) => {
      addFiles(e.target.files);
      fileInput.value = "";
    });

    clearBtn.addEventListener("click", () => {
      selectedFiles = [];
      renderFiles();
    });

    uploadBtn.addEventListener("click", async () => {
      if (!selectedFiles.length) {
        setStatus("Сначала выбери хотя бы один файл.");
        return;
      }

      uploadBtn.disabled = true;
      clearBtn.disabled = true;
      setStatus("Загрузка...");

      try {
        const formData = new FormData();
        for (const file of selectedFiles) {
          formData.append("files", file, file.name);
        }
        formData.append("titlePrefix", titlePrefix.value.trim());

        const response = await fetch("/api/upload", {
          method: "POST",
          body: formData,
        });

        const data = await response.json();
        if (!response.ok) {
          throw new Error(data.error || "Upload failed");
        }

        const lines = data.items.map((item, index) => {
          return `${index + 1}. ${item.fileName} → Ticket ID: ${item.ticketId ?? "created"}`;
        });

        setStatus(`Готово. Создано тикетов: ${data.created}\n\n${lines.join("\n")}`);
        selectedFiles = [];
        renderFiles();
        titlePrefix.value = "";
      } catch (error) {
        setStatus(`Ошибка: ${error.message}`);
      } finally {
        uploadBtn.disabled = false;
        clearBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
