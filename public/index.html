<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Upload tickets</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f6f7fb;
      color: #111;
    }

    .wrap {
      max-width: 900px;
      margin: 40px auto;
      padding: 24px;
    }

    .card {
      background: #fff;
      border-radius: 18px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,.06);
    }

    h1 {
      margin: 0 0 10px;
      font-size: 28px;
    }

    p {
      margin: 0 0 18px;
      color: #555;
    }

    .dropzone {
      border: 2px dashed #bfc6d4;
      border-radius: 16px;
      padding: 36px 20px;
      text-align: center;
      background: #fafbff;
      transition: .2s ease;
      cursor: pointer;
    }

    .dropzone.dragover {
      border-color: #4b7bec;
      background: #eef4ff;
    }

    .controls {
      display: flex;
      gap: 12px;
      margin-top: 16px;
      flex-wrap: wrap;
    }

    input[type="text"] {
      flex: 1;
      min-width: 240px;
      padding: 12px 14px;
      border: 1px solid #d8deea;
      border-radius: 12px;
      font-size: 14px;
    }

    button {
      border: 0;
      border-radius: 12px;
      padding: 12px 18px;
      font-size: 14px;
      cursor: pointer;
      background: #111;
      color: #fff;
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .file-list {
      margin-top: 18px;
      padding: 0;
      list-style: none;
    }

    .file-list li {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 12px;
      border: 1px solid #eceff5;
      border-radius: 10px;
      margin-bottom: 8px;
      background: #fff;
    }

    .status {
      margin-top: 18px;
      white-space: pre-wrap;
      font-size: 14px;
      background: #f6f8fc;
      border-radius: 12px;
      padding: 14px;
      min-height: 56px;
      line-height: 1.5;
    }

    .hint {
      margin-top: 10px;
      font-size: 13px;
      color: #777;
    }

    .link-btn {
      background: #eceff5;
      color: #111;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>Upload tickets</h1>
      <p>
        Перетащи сюда картинки или видео. Для каждого файла создастся отдельный тикет в Notion.
        Формат имени: <strong>ПРЕФИКС_1_22042026</strong>
      </p>

      <div id="dropzone" class="dropzone">
        <strong>Drag & drop files here</strong>
        <div class="hint">или нажми, чтобы выбрать файлы</div>
        <input id="fileInput" type="file" accept="image/*,video/*" multiple hidden />
      </div>

      <div class="controls">
        <input
          id="titlePrefix"
          type="text"
          placeholder="Префикс, например FB"
        />
        <button id="uploadBtn">Upload</button>
        <button id="clearBtn" class="link-btn" type="button">Clear</button>
      </div>

      <ul id="fileList" class="file-list"></ul>
      <div id="status" class="status">Пока ничего не выбрано.</div>
    </div>
  </div>

  <script>
    const dropzone = document.getElementById("dropzone");
    const fileInput = document.getElementById("fileInput");
    const uploadBtn = document.getElementById("uploadBtn");
    const clearBtn = document.getElementById("clearBtn");
    const fileList = document.getElementById("fileList");
    const statusBox = document.getElementById("status");
    const titlePrefix = document.getElementById("titlePrefix");

    let selectedFiles = [];

    function formatSize(bytes) {
      if (bytes < 1024) return bytes + " B";
      if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + " KB";
      return (bytes / (1024 * 1024)).toFixed(2) + " MB";
    }

    function isAllowedMedia(file) {
      return file.type.startsWith("image/") || file.type.startsWith("video/");
    }

    function renderFiles() {
      fileList.innerHTML = "";

      if (!selectedFiles.length) {
        statusBox.textContent = "Пока ничего не выбрано.";
        return;
      }

      selectedFiles.forEach((file, index) => {
        const li = document.createElement("li");
        li.innerHTML = `
          <span>${index + 1}. ${file.name}</span>
          <span>${formatSize(file.size)}</span>
        `;
        fileList.appendChild(li);
      });

      statusBox.textContent = `Выбрано файлов: ${selectedFiles.length}`;
    }

    function addFiles(files) {
      const incoming = Array.from(files).filter(isAllowedMedia);
      selectedFiles = [...selectedFiles, ...incoming];
      renderFiles();
    }

    dropzone.addEventListener("click", () => fileInput.click());

    fileInput.addEventListener("change", (e) => {
      addFiles(e.target.files);
      fileInput.value = "";
    });

    dropzone.addEventListener("dragover", (e) => {
      e.preventDefault();
      dropzone.classList.add("dragover");
    });

    dropzone.addEventListener("dragleave", () => {
      dropzone.classList.remove("dragover");
    });

    dropzone.addEventListener("drop", (e) => {
      e.preventDefault();
      dropzone.classList.remove("dragover");
      addFiles(e.dataTransfer.files);
    });

    clearBtn.addEventListener("click", () => {
      selectedFiles = [];
      renderFiles();
    });

    uploadBtn.addEventListener("click", async () => {
      if (!selectedFiles.length) {
        statusBox.textContent = "Сначала выбери хотя бы один файл.";
        return;
      }

      uploadBtn.disabled = true;
      statusBox.textContent = "Загрузка...";

      try {
        const formData = new FormData();

        for (const file of selectedFiles) {
          formData.append("files", file, file.name);
        }

        formData.append("titlePrefix", titlePrefix.value.trim());

        const res = await fetch("/api/upload", {
          method: "POST",
          body: formData
        });

        const data = await res.json();

        if (!res.ok || !data.ok) {
          throw new Error(data.error || "Upload failed");
        }

        const lines = data.items.map((item, i) => {
          return `${i + 1}. ${item.originalFileName} -> ${item.title} -> ${item.ticketId ?? "created"}`;
        });

        statusBox.textContent =
          `Готово. Создано: ${data.created}\nBuild: ${data.build}\n\n${lines.join("\n")}`;

        selectedFiles = [];
        renderFiles();
      } catch (err) {
        statusBox.textContent = `Ошибка: ${err.message}`;
      } finally {
        uploadBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
